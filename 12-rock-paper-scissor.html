<!DOCTYPE html>
<html>
  <head>
    <title>Rock paper scissor</title>
    
<link rel="stylesheet"
href="styles/12-rock-paper-scissors.css">
<link rel="icon" type="image/png" href="images/rock-paper-scissor.png">
</head>
  <body>
  <p class="title">Rock Paper Scisssor</p>
  <button  class="move-button  js-rock-button">
    <img src="images/rock-emoji.png" class="move-icon">
  </button>
  
  <button class="move-button  js-paper-button">
   <img src="images/paper-emoji.png" class="move-icon">
  </button>

  <button  class="move-button  js-scissors-button">
   <img src="images/scissors-emoji.png" class="move-icon">
  </button>
<p class="js-result  result"></p>
  <p class="js-move">  </p>
<p class="js-score score"></p>

  <button class="reset-score-button js-reset-button">Reset Score</button>

  <button class="auto-play-button" onclick="
   autoPlay();
  ">Auto Play</button>

   <script src="scripts/12-rock-paper-scissor.js"> </script>
  </body>
  </html>
